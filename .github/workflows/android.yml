name: Android CI Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing, generating..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore ~/.config/.android/debug.keystore || true

      - name: Run Clean & Unit Tests
        run: ./gradlew clean testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Calculate File Checksums & Metadata
        id: checksums
        run: |
          echo "=== ARTIFACTS SUMMARY ==="
          
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$DEBUG_APK" ]; then
            DEBUG_SIZE=$(du -h "$DEBUG_APK" | cut -f1)
            DEBUG_SHA=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)
            echo "DEBUG_APK_SIZE=$DEBUG_SIZE" >> $GITHUB_OUTPUT
            echo "DEBUG_APK_SHA=$DEBUG_SHA" >> $GITHUB_OUTPUT
            echo "Debug APK Size: $DEBUG_SIZE, SHA-256: $DEBUG_SHA"
          fi

          if [ -f "$RELEASE_APK" ]; then
            RELEASE_APK_SIZE=$(du -h "$RELEASE_APK" | cut -f1)
            RELEASE_APK_SHA=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)
            echo "RELEASE_APK_SIZE=$RELEASE_APK_SIZE" >> $GITHUB_OUTPUT
            echo "RELEASE_APK_SHA=$RELEASE_APK_SHA" >> $GITHUB_OUTPUT
            echo "Release APK Size: $RELEASE_APK_SIZE, SHA-256: $RELEASE_APK_SHA"
          fi

          if [ -f "$RELEASE_AAB" ]; then
            RELEASE_AAB_SIZE=$(du -h "$RELEASE_AAB" | cut -f1)
            RELEASE_AAB_SHA=$(sha256sum "$RELEASE_AAB" | cut -d' ' -f1)
            echo "RELEASE_AAB_SIZE=$RELEASE_AAB_SIZE" >> $GITHUB_OUTPUT
            echo "RELEASE_AAB_SHA=$RELEASE_AAB_SHA" >> $GITHUB_OUTPUT
            echo "Release AAB Size: $RELEASE_AAB_SIZE, SHA-256: $RELEASE_AAB_SHA"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload Build Reports & Metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-and-metadata
          path: |
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/logs/manifest-merger-*.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          name: "Jelyta AI Device Guardian v${{ github.run_number }}"
          tag_name: "v${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          body: |
            ## 🚀 Jelyta AI Device Guardian Production Release
            
            **Build Number:** `${{ github.run_number }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            
            ### 📦 Build Artifacts & Verification:
            - **Package Name:** `com.jelyta.deviceguardian`
            - **Release APK:** `app-release.apk`
              - **Size:** `${{ steps.checksums.outputs.RELEASE_APK_SIZE }}`
              - **SHA-256:** `${{ steps.checksums.outputs.RELEASE_APK_SHA }}`
            - **Release AAB:** `app-release.aab`
              - **Size:** `${{ steps.checksums.outputs.RELEASE_AAB_SIZE }}`
              - **SHA-256:** `${{ steps.checksums.outputs.RELEASE_AAB_SHA }}`

      - name: Build Summary
        if: always()
        run: |
          echo "### 📱 Jelyta AI Device Guardian Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** \`com.jelyta.deviceguardian\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK Size:** \`${{ steps.checksums.outputs.DEBUG_APK_SIZE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK SHA-256:** \`${{ steps.checksums.outputs.DEBUG_APK_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK Size:** \`${{ steps.checksums.outputs.RELEASE_APK_SIZE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK SHA-256:** \`${{ steps.checksums.outputs.RELEASE_APK_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release AAB Size:** \`${{ steps.checksums.outputs.RELEASE_AAB_SIZE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release AAB SHA-256:** \`${{ steps.checksums.outputs.RELEASE_AAB_SHA }}\`" >> $GITHUB_STEP_SUMMARY
